name: Catalog qualification

on:
  workflow_call:
    inputs:
      suite:
        description: Compatibility by default; full includes upstream stress tests
        type: string
        default: compatibility

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      # The attempt that wrote the plan. It survives re-runs of failed jobs, so
      # verify checks the plan this run's receipts were made from.
      attempt: ${{ steps.plan.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plan the exact catalog
        id: plan
        env:
          CARGO_TARGET_DIR: target/check
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          SUITE: ${{ inputs.suite }}
          EVENT: ${{ github.event_name }}
        run: |
          cargo build --locked -p proofstorm-qualification
          qualifier=target/check/debug/proofstorm-qualification
          case "$SUITE" in
            compatibility|full) mode=$SUITE ;;
            *) echo 'Unknown qualification suite' >&2; exit 1 ;;
          esac
          # Pull requests run the small pull suite; main, the weekly schedule and
          # manual runs (including a manual run on a branch) cover every claim.
          if [[ "$SUITE" == compatibility && "$EVENT" == pull_request ]]; then
            mode=pull
          fi
          "$qualifier" plan "$REVISION" "$RUN_ID" "$ATTEMPT" "$mode" "$RUNNER_TEMP/plan.json"
          printf 'matrix=%s\n' "$("$qualifier" matrix "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"
          printf 'attempt=%s\n' "$ATTEMPT" >> "$GITHUB_OUTPUT"
          jq -r '.cases[]|"- " + .id + " / " + .platform + ": " + .reason' "$RUNNER_TEMP/plan.json" >> "$GITHUB_STEP_SUMMARY"
      # Artifact names later jobs download carry no attempt number, so a re-run
      # failed job finds what passed jobs uploaded earlier in this run. A job
      # that re-runs replaces its own upload. Evidence stays bound to one plan
      # through the plan identity and digest, which every receipt must match.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-plan-${{ github.sha }}
          path: ${{ runner.temp }}/plan.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  images:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualification-plan-${{ github.sha }}
          path: ${{ runner.temp }}/plan
      - name: Prepare and verify every required public image once
        env:
          CARGO_TARGET_DIR: target/check
        run: |
          cargo build --locked -p proofstorm-qualification
          bash scripts/qualification-cache.sh prepare "$RUNNER_TEMP/plan/plan.json" "$RUNNER_TEMP/images" "$RUNNER_TEMP/image-preparation"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-images-${{ github.sha }}
          # Public registry content only. Never a runtime home or Docker config.
          path: ${{ runner.temp }}/images/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 2

  build:
    name: build (${{ matrix.arch }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.42.4'
      - name: Select repository Rust toolchain
        run: rustup show active-toolchain
      # Dependencies only; workspace crates always rebuild. The controller image
      # builds inside Docker and is not cached here.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target/check
            . -> target/maintainer
            . -> dev-target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Build verified host and controller artifacts once
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash scripts/qualification-build.sh "$PLATFORM" "$RUNNER_TEMP/artifacts"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-build-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 2

  # No separate smoke preflight: smoke runs in the fanout, and a broken runtime
  # fails every shard within minutes anyway.
  execute:
    name: execute (${{ matrix.shard }})
    needs: [plan, build, images]
    strategy:
      fail-fast: false
      # The planner makes 9 shards per architecture: with main's two bundle
      # jobs that fills, and never exceeds, GitHub's free plan's 20 job slots.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk for native clusters
        run: bash scripts/qualification-runner-disk.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualification-plan-${{ github.sha }}
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualification-build-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/artifacts
      - name: Restore matching immutable build artifacts
        run: |
          (cd "$RUNNER_TEMP/artifacts" && sha256sum --check SHA256SUMS)
          tar -xf "$RUNNER_TEMP/artifacts/host.tar"
          docker image load --input "$RUNNER_TEMP/artifacts/controller.tar"
          docker image load --input "$RUNNER_TEMP/artifacts/runtime-images.tar"
          rm "$RUNNER_TEMP/artifacts/host.tar" "$RUNNER_TEMP/artifacts/controller.tar" "$RUNNER_TEMP/artifacts/runtime-images.tar"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualification-images-${{ github.sha }}
          path: ${{ runner.temp }}/images
      # After "Re-run failed jobs", keep the cases this shard already passed.
      # A pattern that matches nothing downloads nothing, so a first attempt
      # simply runs every case.
      - name: Fetch this shard's receipts from an earlier attempt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: qualification-receipts-${{ matrix.shard }}-${{ github.sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/earlier-receipts
      - name: Run every planned case and verify owned cleanup
        env:
          CASES: ${{ toJSON(matrix.cases) }}
        run: |
          printf '%s\n' "$CASES" > "$RUNNER_TEMP/cases.json"
          # Failed attempts' private logs are encrypted to the maintainers' age key.
          recipient=$(grep -m1 -E '^age1[0-9a-z]+$' .github/qualification-logs.age.pub 2>/dev/null || true)
          if [[ -n "$recipient" ]]; then
            if sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y age; then
              export QUALIFICATION_LOG_RECIPIENT="$recipient"
              export QUALIFICATION_LOG_DIR="$RUNNER_TEMP/private-logs"
            else
              echo '::warning::age install failed; private logs stay on the runner'
            fi
          fi
          bash scripts/qualification-cache.sh with "$RUNNER_TEMP/plan/plan.json" "$RUNNER_TEMP/images" "$RUNNER_TEMP/image-cache" \
            target/check/debug/proofstorm-qualification shard "$RUNNER_TEMP/plan/plan.json" "$RUNNER_TEMP/cases.json" \
            "$RUNNER_TEMP/cases" "$RUNNER_TEMP/receipts" "$RUNNER_TEMP/earlier-receipts"
      - name: Save redacted execution receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-receipts-${{ matrix.shard }}-${{ github.sha }}
          # Never upload plaintext runtime homes, seeds, native output or credentials.
          path: ${{ runner.temp }}/receipts/*.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Save encrypted private logs of failed attempts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-private-logs-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          # Only age ciphertext; decrypt with the maintainers' private key.
          path: ${{ runner.temp }}/private-logs/*.age
          if-no-files-found: ignore
          retention-days: 7

  verify:
    if: always()
    needs: [plan, build, images, execute]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require every planned lane to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'keys==["build","execute","images","plan"] and all(.[]; .result=="success")' <<< "$NEEDS"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualification-plan-${{ github.sha }}
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: qualification-receipts-*-${{ github.sha }}
          merge-multiple: false
          path: ${{ runner.temp }}/receipts
      - name: Require complete current evidence for both native architectures
        env:
          CARGO_TARGET_DIR: target/check
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          # The plan job's attempt, not this one's: after a re-run of failed
          # jobs the plan and the passed shards' receipts come from earlier.
          PLAN_ATTEMPT: ${{ needs.plan.outputs.attempt }}
        run: |
          jq -e --arg sha "$REVISION" --arg run "$RUN_ID" --argjson attempt "$PLAN_ATTEMPT" '.identity=={revision:$sha,run_id:$run,attempt:$attempt}' "$RUNNER_TEMP/plan/plan.json"
          cargo run --locked -p proofstorm-qualification -- verify "$RUNNER_TEMP/plan/plan.json" "$RUNNER_TEMP/receipts"
