# cdk-mintd config for the proofstorm regtest stack — LND backend.
# Regtest only. The mnemonic is the famous BIP39 test seed; DO NOT reuse it in
# any real deployment. Mirrors orchard/e2e lnd-cdk-sqlite/mintd.toml wiring.

[info]
url = "http://cdk-mintd:3338"
listen_host = "0.0.0.0"
listen_port = 3338
mnemonic = "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
# Non-zero input fee so overspend/underpay oracles (SPEC A6/A7) have a fee edge
# to probe, matching orchard's e2e mint.
input_fee_ppk = 100

[mint_info]
name = "proofstorm-regtest-cdk"
description = "proofstorm regtest CDK mint (LND backend)"
urls = ["http://cdk-mintd:3338"]

# cdk-mintd 0.17: min/max mint+melt bounds are required on the [ln] backend and
# [ln] is a single-or-many enum — keep a single [ln] table for the one sat unit.
[ln]
ln_backend = "lnd"
unit = "sat"
min_mint = 1
max_mint = 500000
min_melt = 1
max_melt = 500000

[lnd]
address = "https://lnd-a:10009"
cert_file = "/lnd/tls.cert"
macaroon_file = "/lnd/data/chain/bitcoin/regtest/admin.macaroon"

[database]
engine = "sqlite"
