[package]
name = "proofstorm-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
proofstorm-view = { path = "../proofstorm-view" }
proofstorm-core = { path = "../proofstorm-core", default-features = false }
serde_json.workspace = true
serde.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "=0.8.20", features = ["csr"] }
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "HtmlElement", "MouseEvent", "WheelEvent", "PointerEvent", "EventSource", "MessageEvent", "Event", "AbortController", "AbortSignal"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[lints]
workspace = true
