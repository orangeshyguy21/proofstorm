[package]
name = "proofstorm-acceptance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-side acceptance harness: MCP stdio client, kubectl wrapper, and fail-loud JSON accessors."

[dependencies]
toml_edit = "=0.22.27"
semver = "1"
anyhow.workspace = true
base64.workspace = true
nix = { version = "0.29", features = ["term", "fs", "signal", "process"] }
proofstorm-app = { path = "../proofstorm-app" }
clap = { version = "4.5", features = ["derive", "env"] }
proofstorm-kube = { path = "../proofstorm-kube" }
proofstorm-core = { path = "../proofstorm-core" }
proofstorm-qualification = { path = "../proofstorm-qualification" }
proofstorm-store = { path = "../proofstorm-store" }
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
tempfile = "3.20"
tokio = { workspace = true, features = ["process"] }
tonic = { version = "=0.14.6", default-features = false, features = ["transport", "codegen", "tls-ring"] }
tonic-prost = "=0.14.6"
prost = "=0.14.4"

[dev-dependencies]
rusqlite.workspace = true
rcgen = "0.13.2"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "=0.14.6", default-features = false, features = ["router"] }

[lints]
workspace = true
