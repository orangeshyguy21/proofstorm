[package]
name = "proofstorm-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared native protocol and passive observation drivers for component integrations"

[features]
default = ["runtime"]
observation = ["dep:anyhow", "dep:rusqlite", "dep:serde_json"]
runtime = ["dep:proofstorm-core", "observation", "dep:serde", "dep:reqwest", "dep:tokio", "dep:tempfile", "dep:tonic", "dep:tonic-prost", "dep:prost", "dep:cashu", "dep:base64", "dep:sha2"]

[[bin]]
name = "proofstorm-driver"
path = "src/main.rs"
required-features = ["runtime"]

[dependencies]
proofstorm-core = { path = "../proofstorm-core", optional = true }
anyhow = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, features = ["process"], optional = true }
tempfile = { version = "3.20", optional = true }
tonic = { version = "=0.14.6", default-features = false, features = ["transport", "codegen", "tls-ring"], optional = true }
tonic-prost = { version = "=0.14.6", optional = true }
prost = { version = "=0.14.4", optional = true }
cashu = { version = "=0.18.0", default-features = false, optional = true }
base64 = { version = "0.22", optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.20"
sha2.workspace = true
rcgen = "0.13.2"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "=0.14.6", default-features = false, features = ["router"] }

[lints]
workspace = true
