[package]
name = "proofstorm-prober"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
transport = ["dep:tokio"]
runtime = ["transport", "dep:futures", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes", "dep:hickory-resolver"]

[[bin]]
name = "proofstorm-prober"
required-features = ["runtime"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio = { workspace = true, features = ["sync"], optional = true }
futures = { workspace = true, optional = true }
hyper = { version = "1", default-features = false, features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
hickory-resolver = { version = "0.25.2", default-features = false, features = ["system-config", "tokio"], optional = true }

[lints]
workspace = true
