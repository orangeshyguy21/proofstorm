apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: proofstormlabs.proofstorm.dev
spec:
  group: proofstorm.dev
  names:
    categories: []
    kind: ProofstormLab
    plural: proofstormlabs
    shortNames:
    - pslab
    singular: proofstormlab
  scope: Namespaced
  versions:
  - additionalPrinterColumns: []
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ProofstormLabSpec via `CustomResource`
        properties:
          spec:
            properties:
              instanceId:
                type: string
              instanceKey:
                description: Stable opaque identity used to derive the instance namespace.
                type: string
              lab:
                properties:
                  api_version:
                    type: string
                  components:
                    items:
                      properties:
                        config:
                          additionalProperties: true
                          type: object
                        config_version:
                          description: Version of the implementation adapter's configuration contract.
                          type: string
                        control:
                          enum:
                          - laboratory
                          - target
                          - attacker
                          - oracle
                          type: string
                        id:
                          type: string
                        implementation:
                          type: string
                        kind:
                          enum:
                          - bitcoin
                          - lightning
                          - mint
                          - database
                          - identity_provider
                          - wallet
                          - attacker
                          - proxy
                          - oracle
                          type: string
                        version:
                          description: Version of the service binary, image, or implementation.
                          nullable: true
                          type: string
                      required:
                      - config
                      - config_version
                      - control
                      - id
                      - implementation
                      - kind
                      type: object
                    type: array
                  links:
                    items:
                      properties:
                        binding:
                          description: Typed dependency qualifier. Chain bindings require network; payment bindings require method and unit; database bindings require a role; authentication bindings require a protocol. Proofstorm validates the discriminator-specific fields before publication.
                          nullable: true
                          properties:
                            method:
                              enum:
                              - bolt11
                              - bolt12
                              - onchain
                              type: string
                            network:
                              enum:
                              - regtest
                              type: string
                            protocol:
                              enum:
                              - oidc
                              type: string
                            role:
                              enum:
                              - primary
                              - cache
                              - authentication
                              type: string
                            type:
                              enum:
                              - chain
                              - payment
                              - database
                              - authentication
                              type: string
                            unit:
                              maxLength: 16
                              minLength: 1
                              pattern: ^[a-z0-9-]+$
                              type: string
                          required:
                          - type
                          type: object
                          x-kubernetes-validations:
                          - message: chain bindings require only network; payment bindings require only method and unit; database bindings require only role; authentication bindings require only protocol
                            rule: 'self.type == ''chain'' ? has(self.network) && !has(self.method) && !has(self.unit) && !has(self.role) && !has(self.protocol) : (self.type == ''payment'' ? has(self.method) && has(self.unit) && !has(self.network) && !has(self.role) && !has(self.protocol) : (self.type == ''database'' ? has(self.role) && !has(self.network) && !has(self.method) && !has(self.unit) && !has(self.protocol) : has(self.protocol) && !has(self.network) && !has(self.method) && !has(self.unit) && !has(self.role)))'
                        from:
                          type: string
                        id:
                          description: Stable binding identity within one lab revision.
                          type: string
                        kind:
                          enum:
                          - bitcoin_peer
                          - lightning_peer
                          - chain_backend
                          - payment_backend
                          - database_backend
                          - authentication_backend
                          - network_path
                          type: string
                        to:
                          type: string
                      required:
                      - from
                      - id
                      - kind
                      - to
                      type: object
                      x-kubernetes-validations:
                      - message: backend links require a binding; peer and network-path links forbid one
                        rule: '(self.kind == ''chain_backend'' || self.kind == ''payment_backend'' || self.kind == ''database_backend'' || self.kind == ''authentication_backend'') ? has(self.binding) : !has(self.binding)'
                    type: array
                  name:
                    type: string
                  policy:
                    default:
                      allow: []
                      limits:
                        max_components: 64
                        max_config_bytes: 65536
                        max_links: 256
                    properties:
                      allow:
                        default: []
                        items:
                          enum:
                          - catalog.read
                          - lab.read
                          - lab.create
                          - lab.edit
                          - lab.clone
                          - lab.validate
                          - lab.publish
                          - lab.materialize
                          - lab.status
                          - lab.close
                          - experiment.create
                          - experiment.read
                          - experiment.close
                          - lease.acquire
                          - lease.release
                          - action.cancel
                          - topology.inspect
                          - topology.mutate
                          - node.add
                          - node.remove
                          - node.control
                          - component.control
                          - peer.connect
                          - peer.disconnect
                          - wallet.create
                          - wallet.control
                          - wallet.fund
                          - channel.open
                          - channel.close
                          - channel.force_close
                          - channel.rebalance
                          - chain.mine
                          - chain.fee
                          - chain.reorg
                          - network.delay
                          - network.drop
                          - network.partition
                          - network.heal
                          - component.logs
                          - component.exec_live
                          - component.forensics
                          - authentication.test
                          - traffic.capture
                          - oracle.list
                          - oracle.run
                          - artifact.read
                          - policy.read
                          - policy.edit
                          - snapshot.create
                          - snapshot.restore
                          type: string
                        type: array
                      limits:
                        default:
                          max_components: 64
                          max_config_bytes: 65536
                          max_links: 256
                        properties:
                          max_components:
                            default: 64
                            format: uint16
                            maximum: 65535.0
                            minimum: 0.0
                            type: integer
                          max_config_bytes:
                            default: 65536
                            format: uint32
                            minimum: 0.0
                            type: integer
                          max_links:
                            default: 256
                            format: uint16
                            maximum: 65535.0
                            minimum: 0.0
                            type: integer
                        type: object
                    type: object
                required:
                - api_version
                - components
                - links
                - name
                type: object
              lock:
                properties:
                  api_version:
                    type: string
                  digest:
                    type: string
                  entries:
                    items:
                      properties:
                        adapter_version:
                          type: string
                        catalog_id:
                          type: string
                        compatible_dependencies:
                          items:
                            properties:
                              implementation:
                                type: string
                              link_kind:
                                enum:
                                - bitcoin_peer
                                - lightning_peer
                                - chain_backend
                                - payment_backend
                                - database_backend
                                - authentication_backend
                                - network_path
                                type: string
                              versions:
                                items:
                                  type: string
                                type: array
                            required:
                            - implementation
                            - link_kind
                            - versions
                            type: object
                          type: array
                        component_id:
                          type: string
                        config_schema_digest:
                          type: string
                        config_version:
                          type: string
                        effective_config_digest:
                          type: string
                        features:
                          items:
                            enum:
                            - native_cli
                            - regtest
                            - persistent_state
                            - bolt11
                            - bolt12
                            - onchain
                            - clear_auth
                            - blind_auth
                            - sqlite
                            - postgres
                            - redis_cache
                            - oidc_provider
                            - wallet_operations
                            type: string
                          type: array
                        image:
                          type: string
                        protocol_action_adapter_version:
                          nullable: true
                          type: string
                        rollout_digest:
                          type: string
                        source_digest:
                          type: string
                        version:
                          type: string
                      required:
                      - adapter_version
                      - catalog_id
                      - compatible_dependencies
                      - component_id
                      - config_schema_digest
                      - config_version
                      - effective_config_digest
                      - features
                      - image
                      - rollout_digest
                      - source_digest
                      - version
                      type: object
                    type: array
                required:
                - api_version
                - digest
                - entries
                type: object
              revisionDigest:
                description: Digest of the immutable resolved lab revision.
                type: string
              workspaceId:
                type: string
            required:
            - instanceId
            - instanceKey
            - lab
            - lock
            - revisionDigest
            - workspaceId
            type: object
          status:
            nullable: true
            properties:
              components:
                default: []
                items:
                  properties:
                    conditions:
                      items:
                        properties:
                          condition_type:
                            enum:
                            - workload_ready
                            - storage_ready
                            - credentials_ready
                            - service_ready
                            - protocol_ready
                            - dependencies_ready
                            - component_ready
                            - experiment_controllable
                            type: string
                          last_transition_unix:
                            format: int64
                            type: integer
                          message:
                            maxLength: 160
                            type: string
                          reason:
                            enum:
                            - observed
                            - not_observed
                            - stale_revision
                            - workload_available
                            - workload_unavailable
                            - storage_bound
                            - storage_pending
                            - credentials_projected
                            - credentials_missing
                            - endpoints_ready
                            - endpoints_missing
                            - protocol_responding
                            - protocol_probe_pending
                            - protocol_probe_failed
                            - dependencies_satisfied
                            - dependencies_unsatisfied
                            - component_operational
                            - component_not_operational
                            - intentionally_stopped
                            - control_available
                            - control_unavailable
                            type: string
                          state:
                            enum:
                            - 'true'
                            - 'false'
                            - unknown
                            type: string
                        required:
                        - condition_type
                        - last_transition_unix
                        - message
                        - reason
                        - state
                        type: object
                      maxItems: 8
                      type: array
                    id:
                      type: string
                    kind:
                      enum:
                      - bitcoin
                      - lightning
                      - mint
                      - database
                      - identity_provider
                      - wallet
                      - attacker
                      - proxy
                      - oracle
                      type: string
                    observed_revision_digest:
                      type: string
                    observed_rollout_digest:
                      type: string
                    ports:
                      additionalProperties:
                        format: uint16
                        maximum: 65535.0
                        minimum: 0.0
                        type: integer
                      type: object
                    ready:
                      description: Alpha compatibility projection derived only from `ComponentReady`.
                      type: boolean
                    service:
                      type: string
                  required:
                  - conditions
                  - id
                  - kind
                  - observed_revision_digest
                  - observed_rollout_digest
                  - ports
                  - ready
                  - service
                  type: object
                type: array
              instanceNamespace:
                nullable: true
                type: string
              inventory:
                default: []
                items:
                  properties:
                    api_version:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                  - api_version
                  - kind
                  - name
                  - namespace
                  type: object
                type: array
              inventoryDigest:
                nullable: true
                type: string
              message:
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              observedProtocolProbeLease:
                nullable: true
                type: string
              observedRevisionDigest:
                description: Immutable lab revision against which this status was observed.
                type: string
              phase:
                enum:
                - Pending
                - Ready
                - Closing
                - CleanupBlocked
                type: string
              teardownReceipt:
                nullable: true
                properties:
                  checkedAt:
                    type: string
                  instanceId:
                    type: string
                  instanceNamespace:
                    type: string
                  inventoryDigest:
                    type: string
                  verifiedAbsent:
                    type: boolean
                required:
                - checkedAt
                - instanceId
                - instanceNamespace
                - inventoryDigest
                - verifiedAbsent
                type: object
            required:
            - observedRevisionDigest
            - phase
            type: object
        required:
        - spec
        title: ProofstormLab
        type: object
    served: true
    storage: true
    subresources:
      status: {}
