apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: proofstormcomponents.proofstorm.dev
spec:
  group: proofstorm.dev
  names:
    kind: ProofstormComponent
    plural: proofstormcomponents
    shortNames:
    - pscomp
    singular: proofstormcomponent
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ProofstormComponentSpec via `CustomResource`
        properties:
          spec:
            description: |-
              One component's observed state, owned by its cell. Written by the controller
              only when the component's state changes.
            properties:
              componentId:
                type: string
              instanceKey:
                type: string
            required:
            - componentId
            - instanceKey
            type: object
          status:
            nullable: true
            properties:
              conditions:
                items:
                  properties:
                    condition_type:
                      enum:
                      - workload_ready
                      - storage_ready
                      - credentials_ready
                      - service_ready
                      - protocol_ready
                      - dependencies_ready
                      - component_ready
                      - experiment_controllable
                      type: string
                    last_transition_unix:
                      format: int64
                      type: integer
                    message:
                      maxLength: 160
                      type: string
                    reason:
                      enum:
                      - observed
                      - not_observed
                      - stale_revision
                      - workload_available
                      - workload_unavailable
                      - image_pull_failed
                      - image_pull_backoff
                      - invalid_image_name
                      - container_config_error
                      - container_crash_loop
                      - container_start_error
                      - container_exited
                      - pod_unschedulable
                      - storage_bound
                      - storage_pending
                      - credentials_projected
                      - credentials_missing
                      - endpoints_ready
                      - endpoints_missing
                      - protocol_responding
                      - protocol_probe_pending
                      - protocol_probe_failed
                      - dependencies_satisfied
                      - dependencies_unsatisfied
                      - component_operational
                      - component_not_operational
                      - intentionally_stopped
                      - control_available
                      - control_unavailable
                      type: string
                    state:
                      enum:
                      - 'true'
                      - 'false'
                      - unknown
                      type: string
                  required:
                  - condition_type
                  - last_transition_unix
                  - message
                  - reason
                  - state
                  type: object
                maxItems: 8
                type: array
              id:
                type: string
              kind:
                enum:
                - bitcoin
                - lightning
                - ark_server
                - spark_server
                - payment_processor
                - mint
                - database
                - identity_provider
                - wallet
                - workspace
                - proxy
                - oracle
                type: string
              observed_revision_digest:
                type: string
              observed_rollout_digest:
                type: string
              ports:
                additionalProperties:
                  format: uint16
                  maximum: 65535.0
                  minimum: 0.0
                  type: integer
                type: object
              protocol_observation:
                description: Freshness of a completed protocol check, independently of condition transition time.
                nullable: true
                properties:
                  elapsed_micros:
                    format: uint64
                    minimum: 0.0
                    type: integer
                  expires_at_unix:
                    format: int64
                    type: integer
                  observed_at_unix:
                    format: int64
                    type: integer
                required:
                - elapsed_micros
                - expires_at_unix
                - observed_at_unix
                type: object
              ready:
                description: Alpha compatibility projection derived only from `ComponentReady`.
                type: boolean
              service:
                type: string
            required:
            - conditions
            - id
            - kind
            - observed_revision_digest
            - observed_rollout_digest
            - ports
            - ready
            - service
            type: object
        required:
        - spec
        title: ProofstormComponent
        type: object
    served: true
    storage: true
    subresources:
      status: {}
