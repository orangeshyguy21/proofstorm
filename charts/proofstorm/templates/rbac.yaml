apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "proofstorm.name" . }}
rules:
  - apiGroups: ["proofstorm.dev"]
    resources: ["proofstormcells"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["proofstorm.dev"]
    resources: ["proofstormcells/status", "proofstormcells/finalizers"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["proofstorm.dev"]
    resources: ["proofstormcellactions"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["proofstorm.dev"]
    resources: ["proofstormcellactions/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["proofstorm.dev"]
    resources: ["proofstormcandidatebuilds"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["proofstorm.dev"]
    resources: ["proofstormcandidatebuilds/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    # kube-rs WebSocket negotiation uses GET while kubectl's legacy transport
    # uses POST; grant both on the narrow exec subresource.
    verbs: ["get", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "proofstorm.name" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "proofstorm.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "proofstorm.name" . }}
    namespace: {{ .Release.Namespace }}
