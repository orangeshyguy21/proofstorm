apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "proofstorm.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "proofstorm.name" . }}
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "proofstorm.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "proofstorm.name" . }}
    spec:
      serviceAccountName: {{ include "proofstorm.name" . }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proofstormd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: PROOFSTORM_PRIVATE_ROOT
              value: /var/lib/proofstorm/private
          volumeMounts:
            - name: private-custody
              mountPath: /var/lib/proofstorm
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: private-custody
          persistentVolumeClaim:
            claimName: {{ include "proofstorm.name" . }}-private
