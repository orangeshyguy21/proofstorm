apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "proofstorm.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "proofstorm.name" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "proofstorm.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "proofstorm.name" . }}
    spec:
      serviceAccountName: {{ include "proofstorm.name" . }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proofstormd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
{{ toYaml .Values.resources | indent 12 }}
