apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "proofstorm.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "proofstorm.name" . }}
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "proofstorm.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "proofstorm.name" . }}
    spec:
      serviceAccountName: {{ include "proofstorm.name" . }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proofstormd
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: PROOFSTORM_PROBER_IMAGE
              value: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
            - name: PROOFSTORM_PRIVATE_ROOT
              value: /var/lib/proofstorm/private
            - name: PROOFSTORM_ACTION_SLOTS
              value: {{ .Values.controller.actionSlots | quote }}
            - name: PROOFSTORM_NATIVE_STARTS
              value: {{ .Values.controller.nativeStarts | quote }}
            - name: PROOFSTORM_NATIVE_STARTS_PER_COMPONENT
              value: {{ .Values.controller.nativeStartsPerComponent | quote }}
            - name: PROOFSTORM_NATIVE_POLLS
              value: {{ .Values.controller.nativePolls | quote }}
            - name: PROOFSTORM_START_DEADLINE_SECONDS
              value: {{ .Values.controller.startDeadlineSeconds | quote }}
            - name: PROOFSTORM_RECONCILE_LOG_MS
              value: {{ .Values.controller.reconcileLogMs | quote }}
          volumeMounts:
            - name: private-custody
              mountPath: /var/lib/proofstorm
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: private-custody
          persistentVolumeClaim:
            claimName: {{ include "proofstorm.name" . }}-private
