image:
  repository: proofstorm-registry.localhost:5000/proofstormd
  tag: 0.1.0-alpha.13
  # Release bundles set an immutable digest; empty preserves contributor tags.
  digest: ""
  pullPolicy: Always

# No CPU limit: every native command start passes through the controller. With
# 24 agents on one cell, a 250m limit kept it throttled in every scheduling
# period, so starts slowed until they missed their deadline. Unthrottled it used
# about 0.28 cores. The request keeps its fair share on a busy node; memory
# stays capped because running out takes the whole host down.
resources:
  requests:
    cpu: 250m
    memory: 64Mi
  limits:
    memory: 256Mi

# Work the controller runs at once and how long a one-off action may wait to
# start. `storm config` sets these in runtime.toml and `storm setup` applies
# them; the controller refuses combinations that let one kind of work take
# every slot.
controller:
  actionSlots: 16
  nativeStarts: 4
  nativeStartsPerComponent: 2
  nativePolls: 6
  startDeadlineSeconds: 120
